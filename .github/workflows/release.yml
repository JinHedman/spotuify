name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds natively. Linux cross-builds with cargo-zigbuild
          # against a pinned glibc 2.28, so the floor doesn't depend on the
          # runner image; TLS is rustls, so there is no OpenSSL.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.28"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            glibc: "2.28"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.glibc
        run: |
          python3 -m venv "${RUNNER_TEMP}/zig"
          "${RUNNER_TEMP}/zig/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.16.0
          echo "${RUNNER_TEMP}/zig/bin" >> "${GITHUB_PATH}"

      - name: Build
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.glibc
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="spot-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/spot" README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: spot-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: spot-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*
