[package]
name = "spotuify"
version = "0.1.0"
authors = ["Filip Hedman <filip.hedman@eyevinn.se>"]
edition = "2021"
description = "A terminal client for Spotify"
license = "MIT"
readme = "README.md"
repository = "https://github.com/filip/spotuify"
keywords = ["spotify", "tui", "terminal", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "spot"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }

rspotify = { version = "0.16", features = ["cli"] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "signal",
  "time",
  "fs",
  "io-util",
  "io-std",
  "net",
] }
futures = "0.3"

clap = { version = "4.6", features = ["derive", "env"] }

anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

tracing = "0.1"

directories = "5"

chrono = { version = "0.4", features = ["serde"] }

webbrowser = "1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
